<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2 Final//EN">
<html>
<head>
    <title>Google+ - Register</title>
</head>
<body bgcolor="#e0e0e0" text="#000000">
<center>
    <h2><font color="#1a73e8">Create Google+ Account</font></h2>
    
    {% if error %}
        <p><font color="red"><b>{{ error }}</b></font></p>
    {% endif %}

    <form method="POST">
        <table border="0" cellpadding="4" cellspacing="2">
            <tr>
                <td align="right"><b>Username:</b></td>
                <td><input type="text" name="username" size="20"></td>
            </tr>
            <tr>
                <td align="right"><b>Password:</b></td>
                <td><input type="password" name="password" size="20"></td>
            </tr>
            <tr>
                <td align="right"><b>Confirm:</b></td>
                <td><input type="password" name="confirm_password" size="20"></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Sign Up">
                </td>
            </tr>
        </table>
    </form>

    <hr width="40%">
    <p>Already have an account? <a href="{{ url_for('login') }}">Log In</a></p>
    <p><a href="/">Back to Home</a></p>
</center>
</body>
</html>
