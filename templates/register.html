<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2 Final//EN">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Google+ - Register</title>
</head>
<body bgcolor="#e5e5e5" text="#000000">

    <table width="100%" height="100%" border="0" cellspacing="0" cellpadding="0">
        <tr>
            <td align="center" valign="middle">
                
                <!-- Картка реєстрації у вигляді таблиці HTML 3 -->
                <table width="300" border="1" bordercolor="#cccccc" cellspacing="0" cellpadding="15" bgcolor="#ffffff">
                    <tr>
                        <td align="center">
                            <font face="Arial, sans-serif" size="5" color="#d32f2f"><b>Google+ Register</b></font>
                            <br><br>

                            {% if error %}
                            <font face="Arial, sans-serif" size="2" color="#d32f2f"><b>{{ error }}</b></font>
                            <br><br>
                            {% endif %}

                            <form method="POST">
                                <table border="0" cellspacing="0" cellpadding="3" width="100%">
                                    <tr>
                                        <td align="left"><font face="Arial, sans-serif" size="2"><b>Username:</b></font></td>
                                    </tr>
                                    <tr>
                                        <td align="left"><input type="text" name="username" size="25"></td>
                                    </tr>
                                    <tr>
                                        <td align="left"><font face="Arial, sans-serif" size="2"><b>Password:</b></font></td>
                                    </tr>
                                    <tr>
                                        <td align="left"><input type="password" name="password" size="25"></td>
                                    </tr>
                                    <tr>
                                        <td align="center"><br><input type="submit" value="Sign Up"></td>
                                    </tr>
                                </table>
                            </form>

                            <br>
                            <font face="Arial, sans-serif" size="2">
                                Already have an account?<br>
                                <a href="{{ url_for('login') }}">Sign In</a>
                            </font>
                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>

</body>
</html>
